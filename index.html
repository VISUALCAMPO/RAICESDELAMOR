<script>
let currentStep = 1;
const totalSteps = 3;

function goStep(n) {
  if (n > currentStep && !validateStep(currentStep)) return;

  document.getElementById('step' + currentStep).classList.remove('active');
  document.getElementById('s' + currentStep).classList.remove('active');
  if (n > currentStep) {
    document.getElementById('s' + currentStep).classList.add('done');
    document.getElementById('s' + currentStep).querySelector('.step-circle').textContent = '✓';
  } else {
    document.getElementById('s' + currentStep).classList.remove('done');
    document.getElementById('s' + currentStep).querySelector('.step-circle').textContent = currentStep;
  }

  currentStep = n;
  document.getElementById('step' + currentStep).classList.add('active');
  document.getElementById('s' + currentStep).classList.add('active');
  document.getElementById('s' + currentStep).classList.remove('done');

  const pct = Math.round((currentStep / totalSteps) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = 'Etapa ' + currentStep + ' de ' + totalSteps;
  document.getElementById('progressPct').textContent = pct + '%';

  if (currentStep === 3) buildResumo();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function validateStep(step) {
  let ok = true;
  const show = (id) => { const el = document.getElementById(id); if(el) el.style.display='block'; ok=false; };
  const hide = (id) => { const el = document.getElementById(id); if(el) el.style.display='none'; };

  if (step === 1) {
    const nome = document.getElementById('nome');
    if (!nome.value.trim()) { nome.classList.add('error'); show('err-nome'); } else { nome.classList.remove('error'); hide('err-nome'); }
    const wp = document.getElementById('whatsapp');
    if (!wp.value.trim()) { wp.classList.add('error'); show('err-whatsapp'); } else { wp.classList.remove('error'); hide('err-whatsapp'); }
    const em = document.getElementById('email');
    if (!em.value.includes('@')) { em.classList.add('error'); show('err-email'); } else { em.classList.remove('error'); hide('err-email'); }
    const cid = document.getElementById('cidade');
    if (!cid.value.trim()) { cid.classList.add('error'); show('err-cidade'); } else { cid.classList.remove('error'); hide('err-cidade'); }
    const mod = document.getElementById('modalidade');
    if (!mod.value) { mod.classList.add('error'); show('err-modalidade'); } else { mod.classList.remove('error'); hide('err-modalidade'); }
    if (!document.querySelector('input[name="origem"]:checked')) { show('err-origem'); } else { hide('err-origem'); }
  }

  if (step === 2) {
    const servicos = document.querySelectorAll('input[name="servico"]:checked');
    if (servicos.length === 0) { show('err-servico'); ok=false; } else { hide('err-servico'); }
    if (!document.querySelector('input[name="experiencia"]:checked')) { show('err-experiencia'); } else { hide('err-experiencia'); }
  }

  return ok;
}

function buildResumo() {
  const g = (id) => document.getElementById(id)?.value || '—';
  const r = (name) => document.querySelector(`input[name="${name}"]:checked`)?.value || '—';
  const servicos = [...document.querySelectorAll('input[name="servico"]:checked')].map(i => i.value).join(', ') || '—';
  const apelido = g('apelido') ? ` (${g('apelido')})` : '';
  document.getElementById('resumo').innerHTML = `
    <strong>🌿 Resumo da sua intenção</strong><br><br>
    👤 <strong>Nome:</strong> ${g('nome')}${apelido}<br>
    📱 <strong>WhatsApp:</strong> ${g('whatsapp')}<br>
    ✉️ <strong>E-mail:</strong> ${g('email')}<br>
    📍 <strong>Cidade:</strong> ${g('cidade')} · ${g('modalidade')}<br>
    ✦ <strong>Interesse em:</strong> ${servicos}<br>
    🌱 <strong>Experiência anterior:</strong> ${r('experiencia')}<br>
  `;
}

function submitForm() {
  const t = document.getElementById('termos').checked;
  const l = document.getElementById('lgpd').checked;
  if (!t) document.getElementById('err-termos').style.display = 'block';
  else document.getElementById('err-termos').style.display = 'none';
  if (!l) document.getElementById('err-lgpd').style.display = 'block';
  else document.getElementById('err-lgpd').style.display = 'none';
  if (!t || !l) return;

  // Coletando os dados do formulário
  const g = (id) => document.getElementById(id)?.value || 'Não informado';
  const r = (name) => {
    const el = document.querySelector(`input[name="${name}"]:checked`);
    return el ? el.value : 'Não informado';
  };
  
  const servicosArr = [...document.querySelectorAll('input[name="servico"]:checked')].map(i => i.value);
  const servicos = servicosArr.length > 0 ? servicosArr.join(', ') : 'Não informado';

  // Montando a mensagem para o WhatsApp da Elena
  let mensagem = `*🌿 Nova Intenção - Raíces del Amor*\n\n`;
  mensagem += `*Nome:* ${g('nome')}${g('apelido') ? ' (' + g('apelido') + ')' : ''}\n`;
  mensagem += `*WhatsApp:* ${g('whatsapp')}\n`;
  mensagem += `*E-mail:* ${g('email')}\n`;
  mensagem += `*Cidade:* ${g('cidade')}\n`;
  mensagem += `*Atendimento:* ${g('modalidade')}\n`;
  mensagem += `*Origem:* ${r('origem')}\n\n`;
  mensagem += `*Interesse em:* ${servicos}\n`;
  mensagem += `*Sentindo-se:* ${r('momento')}\n`;
  mensagem += `*Experiência:* ${r('experiencia')}\n\n`;
  if(g('mensagem') !== 'Não informado') mensagem += `*Mensagem:* ${g('mensagem')}\n\n`;
  if(g('horario') !== 'Não informado') mensagem += `*Preferência de Horário:* ${g('horario')}\n`;
  if(g('obs') !== 'Não informado') mensagem += `*Outras infos:* ${g('obs')}\n`;

  // Número da Elena
  const numeroElena = '5516992221496';
  
  // Criando o link do WhatsApp
  const linkWhatsApp = `https://wa.me/${numeroElena}?text=${encodeURIComponent(mensagem)}`;

  // Abre o WhatsApp em uma nova aba
  window.open(linkWhatsApp, '_blank');

  // Mostra a tela de sucesso no site
  document.querySelectorAll('.section-card, .steps, .progress-wrap').forEach(el => el.style.display = 'none');
  document.getElementById('formFooter').style.display = 'none';
  const nome = document.getElementById('nome').value;
  const apelido = document.getElementById('apelido').value;
  document.getElementById('nomeConfirm').textContent = apelido || nome;
  document.getElementById('successScreen').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
</script>
